<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>MacNest</title>
  </head>

  <body>
    <!--
      THESIS: A local Homebrew workspace that makes package inventory and upkeep clear without turning setup into a terminal.
      OWN-WORLD: A SwiftUI-inspired Mac utility: system typography, grouped light or dark surfaces, quiet separators, selected sidebar rows, and native blue actions.
      STORY: Read local package status, choose a package area, then install, update, or remove packages with clear feedback.
      FIRST VIEWPORT: A 246px sidebar anchors navigation and Homebrew status; the toolbar frames a focused Overview with a scan action, three inventory summaries, and package sections.
      FORM: The user's pinned SwiftUI-inspired macOS direction. The sidebar becomes icon-led below 680px, with content grids adapting to narrow widths.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script>
      (() => {
        const key = "macnest.appearance";
        let appearance = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "light" || stored === "dark") appearance = stored;
        } catch {
          // The application will use the system appearance if storage is unavailable.
        }
        const followsDarkSystem = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false;
        document.documentElement.dataset.theme = appearance === "system"
          ? followsDarkSystem ? "dark" : "light"
          : appearance;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
